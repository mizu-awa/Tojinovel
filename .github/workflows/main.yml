name: Build & Release

on:
  push:
    branches:
      - main

permissions:
  contents: write   # tag / release / wiki push 用
  pages: write      # GitHub Pages デプロイ用
  id-token: write   # Pages OIDC トークン用

jobs:
  # ----------------------------
  # 変更検知
  # ----------------------------
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      core:    ${{ steps.changes.outputs.core }}
      samples: ${{ steps.changes.outputs.samples }}
      wiki:    ${{ steps.changes.outputs.wiki }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }})
          fi

          has_samples=$(echo "$files" | grep -c "^samples/" || true)
          has_wiki=$(echo "$files" | grep -c "^docs/wiki/" || true)
          has_core=$(echo "$files" | grep -v "^samples/" | grep -v "^docs/wiki/" | grep -c "." || true)

          echo "samples=$( [ "$has_samples" -gt 0 ] && echo True || echo False )" >> $GITHUB_OUTPUT
          echo "wiki=$( [ "$has_wiki" -gt 0 ] && echo True || echo False )"       >> $GITHUB_OUTPUT
          echo "core=$( [ "$has_core" -gt 0 ] && echo True || echo False )"       >> $GITHUB_OUTPUT

  # ----------------------------
  # バージョン生成
  # ----------------------------
  generate-version:
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'True' || needs.detect-changes.outputs.samples == 'True'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Generate version
        id: version
        run: |
          version="v0.1.${{ github.run_number }}.${{ github.run_attempt }}"
          echo "version=$version" >> $GITHUB_OUTPUT

  # ----------------------------
  # 3OS ビルド（matrix）
  # ----------------------------
  build:
    needs: [detect-changes, generate-version]
    if: needs.detect-changes.outputs.core == 'True' || needs.detect-changes.outputs.samples == 'True'
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact-name: windows
          - os: macos-latest
            artifact-name: mac
          - os: ubuntu-latest
            artifact-name: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Write version file
        shell: pwsh
        run: |
          $version = "${{ needs.generate-version.outputs.version }}"
          "VITE_RELEASE_VERSION=$version" | Out-File .env.local -Encoding utf8

      - name: Build all
        shell: pwsh
        run: ./scripts/build-all.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact-name }}
          path: release/
          retention-days: 1

  # ----------------------------
  # Release 作成
  # ----------------------------
  release:
    needs: [detect-changes, generate-version, build]
    if: needs.detect-changes.outputs.core == 'True' || needs.detect-changes.outputs.samples == 'True'
    runs-on: ubuntu-latest

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release-windows/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: release-mac
          path: release-mac/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: release-linux/

      - name: Collect release files
        run: |
          mkdir -p release-final/
          cp release-windows/tojinovel-*.zip release-final/ 2>/dev/null || true
          cp release-mac/tojinovel-*.zip      release-final/ 2>/dev/null || true
          cp release-linux/tojinovel-*.zip    release-final/ 2>/dev/null || true
          # サンプルZIPはOSに依存しないため1つのみコピー
          cp -r release-windows/samples/      release-final/ 2>/dev/null || true
          ls -la release-final/
          ls -la release-final/samples/ 2>/dev/null || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.generate-version.outputs.version }}
          name: ${{ needs.generate-version.outputs.version }}
          generate_release_notes: true
          prerelease: true   # 安定版にしたら false
          files: |
            release-final/*.zip
            release-final/samples/*.zip

  # ----------------------------
  # Wiki 更新
  # ----------------------------
  wiki:
    needs: detect-changes
    if: needs.detect-changes.outputs.wiki == 'True'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update GitHub Wiki
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone https://x-access-token:$GITHUB_TOKEN@github.com/${{ github.repository }}.wiki.git wiki
          cp -r docs/wiki/. wiki/
          cd wiki
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No wiki changes to commit"
          else
            git commit -m "Update wiki"
            git push
          fi

  # ----------------------------
  # ブラウザ版 GitHub Pages デプロイ
  # ----------------------------
  deploy-browser:
    needs: [detect-changes, generate-version]
    if: needs.detect-changes.outputs.core == 'True'
    runs-on: ubuntu-latest
    environment: github-pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install npm dependencies
        run: npm ci

      - name: Write version file
        run: echo "VITE_RELEASE_VERSION=${{ needs.generate-version.outputs.version }}" > .env.local

      - name: Build browser version
        run: npm run build:browser

      - name: Delete old Pages artifact (for re-runs)
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts.data.artifacts) {
              if (artifact.name === 'github-pages') {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-browser/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
